<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de intercambios</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="./styleindex.css">
</head>
<body>
    <!--Barra superior de navegación-->
    <nav class="barraSuperior">
        <a class="navbar-brand fw-bold logo" href="index.html">StackSolvers</a>
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="intercambios.html">Intercambios</a>
        <a class="nav-link" href="alta_usuario.html">Alta Usuario</a>
        <span class="navbar-text fw-bold text-primary" id="usuarioActivo">-no login-</span>
    </nav>
    
    <header class="container py-4">
        <h1>Gestión de intercambios de idiomas</h1>
    </header>

    <main class="container pb-5">
        <section aria-labelledby="titulo-formulario" class="mb-5">
            <h2 id="titulo-formulario">Publicar un intercambio</h2>
            <form id="form-intercambio">
                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo de intercambio</label>
                    <select id="tipo" name="tipo" class="form-select" required>
                        <option value="">Selecciona una opción</option>
                        <option value="oferta">Ofrezco idioma</option>
                        <option value="peticion">Busco idioma</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="fecha" class="form-label">Fecha</label>
                    <input type="date" id="fecha" name="fecha" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        class="form-control"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Publicar intercambio</button>
            </form>
        </section>

        <section aria-labelledby="titulo-listado">
            <h2 id="titulo-listado">Intercambios publicados</h2>
            <div class="table-responsive">
                <table class="table table-striped align-middle" aria-label="Intercambios publicados">
                    <thead>
                        <tr>
                            <th scope="col">Título</th>
                            <th scope="col">Email</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listado-intercambios"></tbody>
                </table>
            </div>
            <figure class="mt-4">
                <figcaption class="h5">Intercambios por tipo</figcaption>
                <canvas id="grafico-intercambios" width="560" height="150"
                    class="img-fluid" aria-hidden="true"></canvas>
                <p id="resumen-grafico"></p>
            </figure>
        </section>
    </main>

    <script type="module" src="./int_3_intercambios.js"></script>
</body>
</html>
